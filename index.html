<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        try {
          var currentFetch = window.fetch ? window.fetch.bind(window) : undefined;
          var desc =
            Object.getOwnPropertyDescriptor(window, 'fetch') ||
            Object.getOwnPropertyDescriptor(Window.prototype, 'fetch');
          if (desc && desc.configurable !== false) {
            Object.defineProperty(window, 'fetch', {
              configurable: true,
              enumerable: true,
              get: function () {
                return currentFetch;
              },
              set: function (nextFetch) {
                if (typeof nextFetch === 'function') {
                  currentFetch = nextFetch;
                }
              },
            });
          }
        } catch (_e) {
          // Ignore if non-configurable
        }

        window.addEventListener(
          'error',
          function (event) {
            var msg = event && event.message ? String(event.message) : '';
            var file = event && event.filename ? String(event.filename) : '';
            if (
              msg.indexOf('Cannot set property fetch') !== -1 ||
              file.indexOf('chrome-extension://') === 0
            ) {
              event.preventDefault();
              event.stopImmediatePropagation();
              return false;
            }
          },
          true
        );

        window.addEventListener(
          'unhandledrejection',
          function (event) {
            var reasonStr = event && event.reason ? String(event.reason) : '';
            if (reasonStr.indexOf('Cannot set property fetch') !== -1) {
              event.preventDefault();
              event.stopImmediatePropagation();
            }
          },
          true
        );
      })();
    </script>
